[package]
name = "b3dup"
version = "0.1.0"
edition = "2021"
description = "Fast, multithreaded CLI duplicate file finder and disk space analyzer powered by BLAKE3"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
crossterm = "0.29"
dialoguer = "0.11"
humansize = "2"
indicatif = "0.17"
ratatui = "0.30"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
